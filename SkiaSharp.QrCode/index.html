<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>FeatherQR Playground has moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://guitarrapc.github.io/FeatherQR/">
  <!-- The project site guitarrapc.github.io/SkiaSharp.QrCode/ moved with the repository rename to
       guitarrapc.github.io/FeatherQR/. GitHub redirects the repository but not project Pages, so this
       stub on the user site keeps the links printed in every 1.x NuGet README alive. The script forwards
       the full path, query and hash so shared Playground permalinks and /api/ links keep working;
       the meta refresh is the fallback for clients without script. -->
  <script>
    location.replace("https://guitarrapc.github.io/FeatherQR/" + location.pathname.replace(/^\/SkiaSharp\.QrCode\/?/, "") + location.search + location.hash);
  </script>
  <meta http-equiv="refresh" content="0; url=https://guitarrapc.github.io/FeatherQR/">
</head>
<body>
  <p>The FeatherQR Playground (formerly SkiaSharp.QrCode) has moved to <a href="https://guitarrapc.github.io/FeatherQR/">guitarrapc.github.io/FeatherQR/</a>.</p>
</body>
</html>
